name: Verify
on:
  workflow_call:
permissions:
  contents: read
jobs:
  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun audit
      - name: Scan commit history
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --log-opts=--all .
  workflows:
    name: Workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflows and embedded shell
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
  package:
    name: Package (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: npm install --global npm@12.2.0
      - run: bun install --frozen-lockfile
      - name: Install Linux OCR data
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr-eng
      - name: Install macOS OCR data
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Install Windows OCR data
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "tessdata"
          New-Item -ItemType Directory -Force $data | Out-Null
          Invoke-WebRequest "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/eng.traineddata" -OutFile (Join-Path $data "eng.traineddata")
          "TESSDATA_PREFIX=$data" >> $env:GITHUB_ENV
      - run: bun run check
      - name: Install supported host
        run: npm install --global --allow-scripts=@opencode/cli "@opencode/cli@$(bun -p 'require("./package.json").dependencies["@opencode/plugin"]')"
      - name: Test distributable in clean installations
        run: bun run test:package --output dist/release
      - name: Preserve verified release artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
