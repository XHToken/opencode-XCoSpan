name: Verify
on:
  workflow_call:
permissions:
  contents: read
jobs:
  workflows:
    name: Workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflows and embedded shell
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
  package:
    name: Package (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: npm install --global npm@12.2.0
      - run: bun install --frozen-lockfile
      - name: Install Linux OCR data
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr-eng
      - name: Install macOS OCR data
        if: runner.os == 'macOS'
        run: brew install tesseract
      - run: bun run check
      - name: Install supported host
        run: npm install --global --allow-scripts=@opencode/cli "@opencode/cli@$(bun -p 'require("./package.json").dependencies["@opencode/plugin"]')"
      - name: Test distributable in clean installations
        run: bun run test:package --output dist/release
      - name: Preserve verified release artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
