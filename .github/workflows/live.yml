name: Live models
on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: Optional Bun test name pattern; leave empty for the full suite
        type: string
        default: ""
      install_spec:
        description: Published npm package specifier for the quick-start test; empty uses the local tarball registry
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: live-models
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: live-tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: npm install --global npm@12.2.0
      - run: bun install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr-eng python3-openpyxl
      - name: Install supported host
        run: npm install --global --allow-scripts=@opencode/cli "@opencode/cli@$(bun -p 'require("./package.json").dependencies["@opencode/plugin"]')"
      - name: Write isolated live configuration
        env:
          LIVE_CONFIG: ${{ secrets.XCOSPAN_LIVE_CONFIG }}
        run: |
          test -n "$LIVE_CONFIG"
          umask 077
          printf '%s' "$LIVE_CONFIG" > "$RUNNER_TEMP/live-models.json"
      - name: Exercise actual models and native terminal
        env:
          XCOSPAN_LIVE_CONFIG: ${{ runner.temp }}/live-models.json
          TEST_FILTER: ${{ inputs.test_filter }}
          XCOSPAN_INSTALL_SPEC: ${{ inputs.install_spec }}
        run: |
          args=()
          if [ -n "$TEST_FILTER" ]; then args+=(--test-name-pattern "$TEST_FILTER"); fi
          bun run test:live "${args[@]}"
      - name: Remove credentials and private diagnostics
        if: always()
        run: rm -f "$RUNNER_TEMP/live-models.json" && rm -rf .local/live
